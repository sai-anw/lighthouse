name: Lighthouse CI

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Website URL to test"
        required: false
        default: "https://www.complywise.global"

jobs:
  lighthouse:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Lighthouse CI
        run: |
          npm install --no-save @lhci/cli@0.15.x

      - name: Create Lighthouse configuration
        run: |
          cat > lighthouserc.js <<'EOF'
          module.exports = {
            ci: {
              collect: {
                url: [
                  process.env.WEBSITE_URL || 'https://www.complywise.global'
                ],
                numberOfRuns: 3
              },

              upload: {
                target: 'lhci',
                serverBaseUrl: 'http://20.244.52.48:9001',
                token: process.env.LHCI_TOKEN
              }
            }
          };
          EOF

      - name: Run Lighthouse CI
        env:
          WEBSITE_URL: ${{ inputs.url }}
          LHCI_TOKEN: ${{ secrets.LHCI_TOKEN }}

          # Unique build information
          LHCI_BUILD_CONTEXT__CURRENT_HASH: ${{ github.run_id }}
          LHCI_BUILD_CONTEXT__CURRENT_BRANCH: ${{ github.ref_name }}
          LHCI_BUILD_CONTEXT__COMMIT_TIME: ${{ github.run_id }}
        run: |
          echo "================================="
          echo "Lighthouse URL: $WEBSITE_URL"
          echo "GitHub Run ID: ${{ github.run_id }}"
          echo "GitHub Run Number: ${{ github.run_number }}"
          echo "================================="

          npx lhci autorun
