name: Lighthouse CI

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Website URL to test"
        required: false
        default: "https://www.complywise.global"

jobs:
  lighthouse:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Lighthouse CI
        run: |
          npm install --no-save @lhci/cli@0.15.x

      - name: Create Lighthouse configuration
        run: |
          cat > lighthouserc.js <<'EOF'
          module.exports = {
            ci: {
              collect: {
                url: [
                  process.env.WEBSITE_URL || 'https://www.complywise.global'
                ],
                numberOfRuns: 3
              },

              upload: {
                target: 'lhci',
                serverBaseUrl: 'http://20.244.52.48:9001',
                token: process.env.LHCI_TOKEN
              }
            }
          };
          EOF

      - name: Check website
        env:
          WEBSITE_URL: ${{ inputs.url }}
        run: |
          echo "Testing: $WEBSITE_URL"
          curl -I --fail --max-time 30 "$WEBSITE_URL"

      - name: Run Lighthouse CI
        env:
          WEBSITE_URL: ${{ inputs.url }}
          LHCI_TOKEN: ${{ secrets.LHCI_TOKEN }}

          # Unique build for every GitHub Actions run
          LHCI_BUILD_CONTEXT__CURRENT_HASH: "${{ github.run_id }}"
          LHCI_BUILD_CONTEXT__CURRENT_BRANCH: "${{ github.ref_name }}"
          LHCI_BUILD_CONTEXT__COMMIT_MESSAGE: "Lighthouse run #${{ github.run_number }} - ${{ inputs.url }}"
          LHCI_BUILD_CONTEXT__AUTHOR: "GitHub Actions <actions@github.com>"
          LHCI_BUILD_CONTEXT__COMMIT_TIME: "${{ github.run_id }}"

        run: |
          echo "======================================"
          echo "Website: $WEBSITE_URL"
          echo "Run ID: ${{ github.run_id }}"
          echo "Run Number: ${{ github.run_number }}"
          echo "Author: GitHub Actions"
          echo "======================================"

          npx lhci autorun
